workflows:
  ios-free-build:
    name: iOS Free Accounts Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS Release
        script: |
          flutter build ios --release --no-codesign

      - name: Verify iOS app
        script: |
          set -e

          APP="build/ios/iphoneos/Runner.app"

          test -d "$APP"
          test -f "$APP/Runner"
          test -f "$APP/Frameworks/Flutter.framework/Flutter"
          test -f "$APP/Frameworks/App.framework/App"

          echo "iOS app verification passed"

      - name: Package unsigned Release IPA
        script: |
          set -e

          mkdir -p build/ios/ipa/Payload

          ditto \
            build/ios/iphoneos/Runner.app \
            build/ios/ipa/Payload/Runner.app

          cd build/ios/ipa

          zip -qry unsigned_app.ipa Payload
          unzip -t unsigned_app.ipa

    artifacts:
      - build/ios/ipa/unsigned_app.ipa
