workflows:
  ios-sideloadly-build:
    name: iOS Sideloadly Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for Sideloadly
        script: |
          set -e
          APP="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/sideloadly"

          test -d "$APP"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP" "$IPA_DIR/Payload/Runner.app"

          cd "$IPA_DIR"
          zip -qry adaptive-sideloadly-unsigned.ipa Payload
          unzip -t adaptive-sideloadly-unsigned.ipa

    artifacts:
      - build/ios/sideloadly/adaptive-sideloadly-unsigned.ipa
