
workflows:
  ios-free-build:
    name: iOS Free Accounts Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter --version
          flutter pub get

      - name: Install iOS dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS Release
        script: |
          flutter build ios --release --no-codesign

      - name: Verify iOS app
        script: |
          set -e

          APP="build/ios/iphoneos/Runner.app"

          test -d "$APP"

          echo "Checking app executable..."
          test -f "$APP/Runner"

          echo "Checking Flutter engine..."
          test -f "$APP/Frameworks/Flutter.framework/Flutter"

          echo "Checking compiled Dart code..."
          test -f "$APP/Frameworks/App.framework/App"

          echo "Checking embedded frameworks..."
          ls -la "$APP/Frameworks"

          echo "App verification passed."

      - name: Package unsigned Release IPA
        script: |
          set -e

          mkdir -p build/ios/ipa/Payload

          ditto \
            build/ios/iphoneos/Runner.app \
            build/ios/ipa/Payload/Runner.app

          cd build/ios/ipa

          zip -qry unsigned_app.ipa Payload

          unzip -t unsigned_app.ipa

    artifacts:
      - build/ios/ipa/unsigned_app.ipa
      - /tmp/xcodebuild_logs/*.log
